<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAT HUB - Wireshark Network Analyzer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="soc.css">
</head>
<body class="soc-body">

    <!-- SOC LOGIN MODAL -->
    <div id="soc-login-modal" class="soc-login-overlay">
        <div class="soc-login-box">
            <div class="soc-login-header">
                <i class="fas fa-network-wired"></i>
                <h2>WIRESHARK ANALYZER LOGIN</h2>
            </div>
            <p>Şəbəkə monitorinq panelinə daxil olmaq üçün təsdiqləyin.</p>
            
            <form onsubmit="handleSocLogin(event)">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="soc-login-username" placeholder="İstifadəçi adı" autocomplete="off" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="soc-login-password" placeholder="Şifrə" required>
                </div>
                <button type="submit" id="soc-login-btn">Daxil Ol</button>
            </form>

            <p id="soc-login-error" class="error-msg"></p>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="soc-dashboard" class="soc-container hidden">
        
        <!-- HEADER -->
        <header class="soc-header">
            <div class="header-title">
                <i class="fas fa-ethernet"></i>
                <span>Live Network Interface Analyzer (Wireshark Style)</span>
            </div>
            <div class="header-controls">
                <button id="toggle-stream-btn" class="ctrl-btn pause" onclick="toggleStream()">
                    <i class="fas fa-pause"></i> Pauza
                </button>
                <button class="ctrl-btn clear" onclick="clearPackets()">
                    <i class="fas fa-trash"></i> Təmizlə
                </button>
            </div>
        </header>

        <!-- PACKET FILTER BAR -->
        <div class="filter-bar">
            <i class="fas fa-filter"></i>
            <input type="text" id="packet-filter" placeholder="Filter (məs: tcp, http, 192.168...)" onkeyup="filterPackets()">
        </div>

        <!-- WIRESHARK PACKET TABLE -->
        <div class="packet-table-container">
            <table class="packet-table">
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Time</th>
                        <th>Source IP</th>
                        <th>Destination IP</th>
                        <th>Protocol</th>
                        <th>Length</th>
                        <th>Info / Payload</th>
                    </tr>
                </thead>
                <tbody id="packet-table-body">
                    <!-- Paketlər buraya dinamik axacaq -->
                </tbody>
            </table>
        </div>

        <!-- PACKET DETAILS PANEL (BOTTOM) -->
        <div class="packet-details-panel">
            <h4><i class="fas fa-info-circle"></i> Packet Byte Details</h4>
            <div id="packet-details-content" class="details-content">
                Detallara baxmaq üçün yuxarıdakı cədvəldən hər hansı bir paketi seçin.
            </div>
        </div>

    </div>

    <script src="soc.js"></script>
</body>
</html>
